<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f6078"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Trunk Stock</title></head><body><div id="app"><header><div><h1>Trunk Stock</h1><p id="summary"></p></div><button id="install" hidden>Install App</button></header><main><div class="toolbar"><input id="search" type="search" placeholder="Search item or product code" aria-label="Search inventory"><button id="exportBtn">Export</button><label class="import">Import<input id="importFile" type="file" accept="application/json"></label></div><div id="groups"></div></main><dialog id="noteDialog"><form method="dialog"><h2>Add usage note</h2><p id="noteItem"></p><label>Note<textarea id="noteText" rows="4" placeholder="Case, facility, reason, or other details"></textarea></label><div class="dlg"><button value="cancel">Cancel</button><button id="saveNote" value="default">Save note</button></div></form></dialog><footer>Inventory is saved on this device. Export a backup regularly.</footer></div>
<style>
:root{color-scheme:light dark;--bg:#f4f7fa;--card:#fff;--text:#17212b;--muted:#617181;--brand:#0f6078;--brand2:#0a4c61;--line:#d6e0e7;--low:#a93226;--ok:#1f7a4c}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}#app{max-width:780px;margin:auto;min-height:100vh}header{position:sticky;top:0;z-index:3;background:var(--brand);color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px #0003}h1{font-size:1.45rem;margin:0}header p{margin:3px 0 0;font-size:.87rem;opacity:.9}button,.import{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);padding:10px 13px;font-weight:700;min-height:44px;cursor:pointer}header button{background:#fff;color:var(--brand2);border:0}main{padding:12px}.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-bottom:14px}.toolbar input{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:11px;color:var(--text);font-size:16px}.import{display:flex;align-items:center}.import input{display:none}.category{margin:18px 0 8px;font-size:.82rem;letter-spacing:.06em;color:var(--brand);font-weight:800}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin:8px 0;box-shadow:0 1px 3px #0000000d}.top{display:flex;justify-content:space-between;gap:12px}.name{font-weight:800}.sku{font-size:.84rem;color:var(--muted);margin-top:2px}.updated{font-size:.76rem;color:var(--muted);margin-top:8px}.controls{display:grid;grid-template-columns:48px 60px 48px 1fr;gap:8px;align-items:center;margin-top:12px}.controls button{font-size:1.3rem;padding:5px}.qty{text-align:center;font-size:1.25rem;font-weight:900}.use{font-size:.92rem!important;background:var(--brand);color:#fff;border-color:var(--brand)}.zero{border-color:#e6aaa5}.zero .qty{color:var(--low)}.notes{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}.notes summary{font-size:.84rem;color:var(--muted);cursor:pointer}.note{font-size:.82rem;padding:7px 0;border-bottom:1px dotted var(--line)}dialog{width:min(92vw,520px);border:0;border-radius:16px;padding:20px;background:var(--card);color:var(--text)}dialog::backdrop{background:#0008}dialog h2{margin-top:0}dialog label{font-weight:700}textarea{width:100%;margin-top:7px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--text);font:inherit}.dlg{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.dlg button:last-child{background:var(--brand);color:#fff}footer{text-align:center;color:var(--muted);font-size:.75rem;padding:20px}button:focus,input:focus,textarea:focus,.import:focus-within{outline:3px solid #68b9d4;outline-offset:2px}@media(max-width:520px){.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.controls{grid-template-columns:48px 54px 48px 1fr}.card{padding:12px}}
@media(prefers-color-scheme:dark){:root{--bg:#101820;--card:#18242e;--text:#edf5f8;--muted:#a8bac5;--brand:#146f89;--brand2:#0f6078;--line:#344853}}
</style>
<script>

y": 1, "updated": "2026-11-04T17:38:00-05:00", "notes": []}, {"id": "i14", "category": "CLOTTRIEVER DEVICES", "sku": "42-102", "name": "ClotTriever BOLD", "qty": 2, "updated": "2026-11-04T17:38:00-05:00", "notes": []}, {"id": "i15", "category": "ARTIX DEVICES", "sku": "31-101", "name": "Artix AX 85 cm", "qty": 1, "updated": "2026-11-04T17:38:00-05:00", "notes": []}, {"id": "i16", "category": "ARTIX DEVICES", "sku": "31-102", "name": "Artix AX 115 cm", "qty": 1, "updated": "2026-11-04T17:38:00-05:00", "notes": []}, {"id": "i17", "category": "ARTIX DEVICES", "sku": "32-103", "name": "Artix MT 4-8 mm", "qty": 1, "updated": "2026-11-04T17:38:00-05:00", "notes": []}, {"id": "i18", "category": "ARTIX DEVICES", "sku": "32-102", "name": "Artix MT 3-6 mm", "qty": 1, "updated": "2026-11-04T17:38:00-05:00", "notes": []}, {"id": "i19", "category": "ARTIX DEVICES", "sku": "30-103", "name": "Artix Thin-Walled Sheath, 65 cm", "qty": 2, "updated": "2026-11-04T17:38:00-05:00", "notes": []}, {"id": "i20", "category": "ARTIX DEVICES", "sku": "52-101", "name": "InThrill 8F x 6 cm", "qty": 1, "updated": "2026-11-04T17:38:00-05:00", "notes": []}, {"id": "i21", "category": "MISCELLANEOUS DEVICES", "sku": "99-102", "name": "Large Bore Syringe", "qty": 3, "updated": "2026-11-04T17:38:00-05:00", "notes": []}];const KEY='trunkStockV1';let data;try{data=JSON.parse(localStorage.getItem(KEY))||SEED}catch{data=SEED}let selected=null;const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function stamp(){return new Date().toISOString()}function fmt(s){return new Date(s).toLocaleString([], {month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})}function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}function render(){const q=$('#search').value.trim().toLowerCase();const filtered=data.filter(i=>(i.name+' '+i.sku+' '+i.category).toLowerCase().includes(q));const cats=[...new Set(filtered.map(i=>i.category))];$('#groups').innerHTML=cats.map(c=>`<section><h2 class="category">${esc(c)}</h2>${filtered.filter(i=>i.category===c).map(i=>`<article class="card ${i.qty===0?'zero':''}"><div class="top"><div><div class="name">${esc(i.name)}</div><div class="sku">${esc(i.sku)}</div></div></div><div class="controls"><button data-act="minus" data-id="${i.id}" aria-label="Subtract one ${esc(i.name)}">−</button><div class="qty" aria-label="Quantity">${i.qty}</div><button data-act="plus" data-id="${i.id}" aria-label="Add one ${esc(i.name)}">+</button><button class="use" data-act="use" data-id="${i.id}">Use + note</button></div><div class="updated">Updated ${fmt(i.updated)}</div>${i.notes.length?`<details class="notes"><summary>${i.notes.length} usage note${i.notes.length>1?'s':''}</summary>${i.notes.slice().reverse().map(n=>`<div class="note"><strong>${fmt(n.date)}</strong><br>${esc(n.text)}</div>`).join('')}</details>`:''}</article>`).join('')}</section>`).join('')||'<p>No items found.</p>';const total=data.reduce((a,i)=>a+i.qty,0);$('#summary').textContent=`${data.length} products • ${total} units • Updated ${fmt(Math.max(...data.map(i=>new Date(i.updated))))}`}
$('#groups').addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(!b)return;const i=data.find(x=>x.id===b.dataset.id);if(b.dataset.act==='plus'){i.qty++;i.updated=stamp();save()}if(b.dataset.act==='minus'&&i.qty>0){i.qty--;i.updated=stamp();save()}if(b.dataset.act==='use'){selected=i;$('#noteItem').textContent=`${i.sku} • ${i.name}`;$('#noteText').value='';$('#noteDialog').showModal()}});$('#saveNote').addEventListener('click',e=>{e.preventDefault();const t=$('#noteText').value.trim();if(!t){$('#noteText').focus();return}if(selected.qty>0)selected.qty--;selected.updated=stamp();selected.notes.push({date:selected.updated,text:t});save();$('#noteDialog').close()});$('#search').addEventListener('input',render);$('#exportBtn').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='trunk-stock-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)});$('#importFile').addEventListener('change',async e=>{try{const x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x))throw 0;data=x;save()}catch{alert('That backup file could not be imported.')}});let deferred;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('#install').hidden=false});$('#install').addEventListener('click',async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;$('#install').hidden=true}});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render()})();
</script></body></html>
