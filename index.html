<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Trunk Stock</title></head><body><div id="app"><header><div><h1>Trunk Stock</h1><p id="summary"></p></div><button id="install" hidden>Install App</button></header><main><div class="toolbar"><input id="search" type="search" placeholder="Search item or product code" aria-label="Search inventory"><button id="addBtn" class="primary">+ Add Device</button><button id="exportBtn">Export</button><label class="import">Import<input id="importFile" type="file" accept="application/json"></label></div><div id="groups"></div></main><dialog id="deviceDialog"><form id="deviceForm"><h2 id="deviceTitle">Add Device</h2><input id="deviceId" type="hidden"><label>Product code<input id="deviceSku" required placeholder="e.g. 22-101"></label><label>Device name<input id="deviceName" required placeholder="Device name"></label><label>Category<input id="deviceCategory" list="categoryList" required placeholder="Choose or type a category"><datalist id="categoryList"></datalist></label><label>Quantity<input id="deviceQty" type="number" min="0" step="1" required value="1"></label><div class="dlg"><button type="button" id="cancelDevice">Cancel</button><button type="submit" class="primary">Save Device</button></div></form></dialog><dialog id="noteDialog"><form method="dialog"><h2>Add usage note</h2><p id="noteItem"></p><label>Note<textarea id="noteText" rows="4" placeholder="Case, facility, reason, or other details"></textarea></label><div class="dlg"><button value="cancel">Cancel</button><button id="saveNote" value="default">Save note</button></div></form></dialog><footer>Inventory is saved on this device. Export a backup regularly.</footer></div>
<style>
:root{color-scheme:light dark;--bg:#f5f5f3;--card:#fff;--text:#111;--muted:#5f6368;--brand:#000000;--brand2:#000000;--accent:#FFB502;--line:#d8d8d5;--low:#c62828;--ok:#1f7a4c}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}#app{max-width:780px;margin:auto;min-height:100vh}header{position:sticky;top:0;z-index:3;background:#000;color:#fff;border-bottom:5px solid var(--accent);padding:16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px #0003}h1{font-size:1.45rem;margin:0}header p{margin:3px 0 0;font-size:.87rem;opacity:.9}.primary{background:#000!important;color:#fff!important;border-color:#000!important}.primary:focus{outline-color:var(--accent)!important}button,.import{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);padding:10px 13px;font-weight:700;min-height:44px;cursor:pointer}header button{background:#fff;color:var(--brand2);border:0}main{padding:12px}.toolbar{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;margin-bottom:14px}.toolbar input{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:11px;color:var(--text);font-size:16px}.import{display:flex;align-items:center}.import input{display:none}.category{margin:18px 0 8px;font-size:.82rem;letter-spacing:.06em;color:#000;font-weight:900;border-left:6px solid var(--accent);padding-left:8px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin:8px 0;box-shadow:0 1px 3px #0000000d}.top{display:flex;justify-content:space-between;gap:12px}.manage{display:flex;gap:6px}.manage button{min-height:36px;padding:6px 9px;font-size:.78rem}.name{font-weight:800}.sku{font-size:.84rem;color:var(--muted);margin-top:2px}.updated{font-size:.76rem;color:var(--muted);margin-top:8px}.controls{display:grid;grid-template-columns:48px 60px 48px 1fr;gap:8px;align-items:center;margin-top:12px}.controls button{font-size:1.3rem;padding:5px}.qty{text-align:center;font-size:1.25rem;font-weight:900}.use{font-size:.92rem!important;background:#000;color:#fff;border-color:#000}.zero{border:3px solid var(--low);background:#fff0f0;box-shadow:0 0 0 3px #ffe1e1}.zero .qty{color:var(--low);font-size:1.45rem}.zero .name{color:#9b1c1c}.zero .top:before{content:"OUT OF STOCK";display:inline-block;background:var(--low);color:#fff;border-radius:6px;padding:4px 7px;font-size:.68rem;font-weight:900;letter-spacing:.04em;margin-right:6px}.notes{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}.notes summary{font-size:.84rem;color:var(--muted);cursor:pointer}.note{font-size:.82rem;padding:9px 0;border-bottom:1px dotted var(--line)}.deleteNote{min-height:34px;margin-top:6px;padding:5px 8px;color:var(--low);border-color:#d9a2a2;font-size:.76rem}dialog{width:min(92vw,520px);border:0;border-radius:16px;padding:20px;background:var(--card);color:var(--text)}dialog::backdrop{background:#0008}dialog h2{margin-top:0}dialog label{font-weight:700}dialog label{display:block;margin:10px 0}dialog input{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--text);font:inherit}textarea{width:100%;margin-top:7px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--text);font:inherit}.dlg{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.dlg button:last-child{background:var(--brand);color:#fff}footer{text-align:center;color:var(--muted);font-size:.75rem;padding:20px}button:focus,input:focus,textarea:focus,.import:focus-within{outline:3px solid #68b9d4;outline-offset:2px}@media(max-width:520px){.toolbar{grid-template-columns:1fr 1fr 1fr}.toolbar input{grid-column:1/-1}.controls{grid-template-columns:48px 54px 48px 1fr}.card{padding:12px}}
@media(prefers-color-scheme:dark){:root{--bg:#151515;--card:#232323;--text:#fff;--muted:#b9b9b9;--brand:#000;--brand2:#000;--accent:#FFB502;--line:#444}.category{color:var(--accent)}.zero{background:#3a1717}}
</style>
<script>
(()=>{const SEED=[{"id": "i1", "category": "FLOWTRIEVER DEVICES", "sku": "22-101", "name": "Triever 24", "qty": 2, "updated": "2026-11-04T17:38:00-05:00", "notes": []}, {"id": "i2", "category": "FLOWTRIEVER DEVICES", "sku": "21-201", "name": "Triever 20 Curve", "qty": 1, "updated": "2026-11-04T17:38:00-05:00", "notes": []}, {"id": "i3", "category": "FLOWTRIEVER DEVICES", "sku": "21-101", "name": "Triever 20", "qty": 1, "updated": "2026-11-04T17:38:00-05:00", "notes": []}, {"id": "i4", "category": "FLOWTRIEVER DEVICES", "sku": "25-101", "name": "Triever 16 Catheter", "qty": 1, "updated": "2026-11-04T17:38:00-05:00", "notes": []}, {"id": "i5", "category": "FLOWTRIEVER DEVICES", "sku": "25-201", "name": "Triever 16 Curve", "qty": 2, "updated": "2026-11-04T17:38:00-05:00", "notes": []}, {"id": "i6", "category": "FLOWTRIEVER DEVICES", "sku": "52-101", "name": "Intri24 Sheath", "qty": 2, "updated": "2026-11-04T17:38:00-05:00", "notes": []}, {"id": "i7", "category": "FLOWTRIEVER DEVICES", "sku": "80-101", "name": "FlowSaver", "qty": 3, "updated": "2026-11-04T17:38:00-05:00", "notes": []}, {"id": "i8", "category": "FLOWTRIEVER DEVICES", "sku": "70-102", "name": "FlowStasis", "qty": 3, "updated": "2026-11-04T17:38:00-05:00", "notes": []}, {"id": "i9", "category": "FLOWTRIEVER DEVICES", "sku": "10-104", "name": "FlowTriever Catheter XL", "qty": 1, "updated": "2026-11-04T17:38:00-05:00", "notes": []}, {"id": "i10", "category": "FLOWTRIEVER DEVICES", "sku": "11-102", "name": "FlowTriever2 Catheter", "qty": 1, "updated": "2026-11-04T17:38:00-05:00", "notes": []}, {"id": "i11", "category": "CLOTTRIEVER DEVICES", "sku": "50-101", "name": "ClotTriever Sheath 13F", "qty": 1, "updated": "2026-11-04T17:38:00-05:00", "notes": []}, {"id": "i12", "category": "CLOTTRIEVER DEVICES", "sku": "51-101", "name": "ClotTriever Sheath 16F", "qty": 1, "updated": "2026-11-04T17:38:00-05:00", "notes": []}, {"id": "i13", "category": "CLOTTRIEVER DEVICES", "sku": "40-102", "name": "ClotTriever OG", "qty": 1, "updated": "2026-11-04T17:38:00-05:00", "notes": []}, {"id": "i14", "category": "CLOTTRIEVER DEVICES", "sku": "42-102", "name": "ClotTriever BOLD", "qty": 2, "updated": "2026-11-04T17:38:00-05:00", "notes": []}, {"id": "i15", "category": "ARTIX DEVICES", "sku": "31-101", "name": "Artix AX 85 cm", "qty": 1, "updated": "2026-11-04T17:38:00-05:00", "notes": []}, {"id": "i16", "category": "ARTIX DEVICES", "sku": "31-102", "name": "Artix AX 115 cm", "qty": 1, "updated": "2026-11-04T17:38:00-05:00", "notes": []}, {"id": "i17", "category": "ARTIX DEVICES", "sku": "32-103", "name": "Artix MT 4-8 mm", "qty": 1, "updated": "2026-11-04T17:38:00-05:00", "notes": []}, {"id": "i18", "category": "ARTIX DEVICES", "sku": "32-102", "name": "Artix MT 3-6 mm", "qty": 1, "updated": "2026-11-04T17:38:00-05:00", "notes": []}, {"id": "i19", "category": "ARTIX DEVICES", "sku": "30-103", "name": "Artix Thin-Walled Sheath, 65 cm", "qty": 2, "updated": "2026-11-04T17:38:00-05:00", "notes": []}, {"id": "i20", "category": "ARTIX DEVICES", "sku": "52-101", "name": "InThrill 8F x 6 cm", "qty": 1, "updated": "2026-11-04T17:38:00-05:00", "notes": []}, {"id": "i21", "category": "MISCELLANEOUS DEVICES", "sku": "99-102", "name": "Large Bore Syringe", "qty": 3, "updated": "2026-11-04T17:38:00-05:00", "notes": []}];const KEY='trunkStockV1';let data;try{data=JSON.parse(localStorage.getItem(KEY))||SEED}catch{data=SEED}let selected=null;const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function stamp(){return new Date().toISOString()}function fmt(s){return new Date(s).toLocaleString([], {month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})}function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}function render(){const q=$('#search').value.trim().toLowerCase();const filtered=data.filter(i=>(i.name+' '+i.sku+' '+i.category).toLowerCase().includes(q));const cats=[...new Set(filtered.map(i=>i.category))];$('#groups').innerHTML=cats.map(c=>`<section><h2 class="category">${esc(c)}</h2>${filtered.filter(i=>i.category===c).map(i=>`<article class="card ${i.qty===0?'zero':''}"><div class="top"><div><div class="name">${esc(i.name)}</div><div class="sku">${esc(i.sku)}</div></div><div class="manage"><button data-act="edit" data-id="${i.id}">Edit</button><button data-act="delete" data-id="${i.id}">Delete</button></div></div><div class="controls"><button data-act="minus" data-id="${i.id}" aria-label="Subtract one ${esc(i.name)}">−</button><div class="qty" aria-label="Quantity">${i.qty}</div><button data-act="plus" data-id="${i.id}" aria-label="Add one ${esc(i.name)}">+</button><button class="use" data-act="use" data-id="${i.id}">Use + note</button></div><div class="updated">Updated ${fmt(i.updated)}</div>${i.notes.length?`<details class="notes"><summary>${i.notes.length} usage note${i.notes.length>1?'s':''}</summary>${i.notes.slice().reverse().map(n=>`<div class="note"><strong>${fmt(n.date)}</strong><br>${esc(n.text)}<br><button class="deleteNote" data-act="deleteNote" data-id="${i.id}" data-note-date="${esc(n.date)}">Delete note</button></div>`).join('')}</details>`:''}</article>`).join('')}</section>`).join('')||'<p>No items found.</p>';const total=data.reduce((a,i)=>a+i.qty,0);$('#summary').textContent=`${data.length} products • ${total} units • Updated ${fmt(Math.max(...data.map(i=>new Date(i.updated))))}`}
$('#groups').addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(!b)return;const i=data.find(x=>x.id===b.dataset.id);if(b.dataset.act==='deleteNote'){if(confirm('Delete this usage note?')){i.notes=i.notes.filter(n=>n.date!==b.dataset.noteDate);save()}return}if(b.dataset.act==='edit'){openDevice(i);return}if(b.dataset.act==='delete'){if(confirm('Delete '+i.name+'? This also deletes its saved usage notes.')){data=data.filter(x=>x.id!==i.id);save()}return}if(b.dataset.act==='plus'){i.qty++;i.updated=stamp();save()}if(b.dataset.act==='minus'&&i.qty>0){i.qty--;i.updated=stamp();save()}if(b.dataset.act==='use'){selected=i;$('#noteItem').textContent=`${i.sku} • ${i.name}`;$('#noteText').value='';$('#noteDialog').showModal()}});$('#saveNote').addEventListener('click',e=>{e.preventDefault();const t=$('#noteText').value.trim();if(!t){$('#noteText').focus();return}if(selected.qty>0)selected.qty--;selected.updated=stamp();selected.notes.push({date:selected.updated,text:t});save();$('#noteDialog').close()});function openDevice(i=null){const cats=[...new Set(data.map(x=>x.category))];$('#categoryList').innerHTML=cats.map(c=>`<option value="${esc(c)}">`).join('');$('#deviceTitle').textContent=i?'Edit Device':'Add Device';$('#deviceId').value=i?i.id:'';$('#deviceSku').value=i?i.sku:'';$('#deviceName').value=i?i.name:'';$('#deviceCategory').value=i?i.category:'';$('#deviceQty').value=i?i.qty:1;$('#deviceDialog').showModal()}$('#addBtn').addEventListener('click',()=>openDevice());$('#cancelDevice').addEventListener('click',()=>$('#deviceDialog').close());$('#deviceForm').addEventListener('submit',e=>{e.preventDefault();const id=$('#deviceId').value;const sku=$('#deviceSku').value.trim(),name=$('#deviceName').value.trim(),category=$('#deviceCategory').value.trim();const qty=Math.max(0,parseInt($('#deviceQty').value,10)||0);if(!sku||!name||!category)return;const now=stamp();if(id){const i=data.find(x=>x.id===id);i.sku=sku;i.name=name;i.category=category;i.qty=qty;i.updated=now}else{data.push({id:'i'+Date.now(),category,sku,name,qty,updated:now,notes:[]})}save();$('#deviceDialog').close()});$('#search').addEventListener('input',render);$('#exportBtn').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='trunk-stock-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)});$('#importFile').addEventListener('change',async e=>{try{const x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x))throw 0;data=x;save()}catch{alert('That backup file could not be imported.')}});let deferred;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('#install').hidden=false});$('#install').addEventListener('click',async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;$('#install').hidden=true}});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render()})();
</script></body></html>
